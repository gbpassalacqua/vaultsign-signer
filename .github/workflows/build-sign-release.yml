# Build & sign vaultsign-host.exe on tagged releases via Microsoft
# Trusted Signing (Azure-managed code-signing certificate).
#
# Triggered by:
#   - Push of a `v*` tag (cuts a release).
#   - Manual `workflow_dispatch` (for testing the build path).
#
# The Trusted Signing step is gated on the AZURE_TRUSTED_SIGNING_ACCOUNT
# variable being set — when empty, the workflow still produces an
# unsigned build artifact (useful for testing pre-cert).

name: build-sign-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Pretend this tag fired the workflow (for dispatch testing)"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write   # required to attach assets to the release
  id-token: write   # Azure OIDC federated login (no secret needed)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            $tag = "${{ inputs.tag_name }}"
          }
          if (-not $tag) { $tag = "v0.0.0-dev" }
          "name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Resolved tag: $tag"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: host/go.sum

      - name: Build host binary
        shell: pwsh
        working-directory: host
        run: |
          $ldflags = "-s -w -X main.version=${{ steps.tag.outputs.name }} -X main.commit=$env:GITHUB_SHA"
          go build -ldflags "$ldflags" -o vaultsign-host.exe .\cmd\vaultsign-host
          Get-FileHash vaultsign-host.exe -Algorithm SHA256 |
            Format-List Algorithm, Hash, Path
          (Get-Item vaultsign-host.exe).Length |
            ForEach-Object { "size = $_ bytes" }

      - name: Capture build provenance (unsigned hash)
        shell: pwsh
        working-directory: host
        run: |
          $info = @{
            tag       = "${{ steps.tag.outputs.name }}"
            commit    = "$env:GITHUB_SHA"
            runner    = "$env:RUNNER_OS $env:RUNNER_ARCH"
            go_version = (go version)
            sha256    = (Get-FileHash vaultsign-host.exe -Algorithm SHA256).Hash
            built_at  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ").ToString()
            workflow  = "$env:GITHUB_WORKFLOW @ $env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          Set-Content -Path build-provenance.json -Value $info -Encoding utf8NoBOM
          Get-Content build-provenance.json

      # ── Sign via Microsoft Trusted Signing ───────────────────
      # Skipped entirely if AZURE_TRUSTED_SIGNING_ACCOUNT is empty
      # (e.g. before the Azure account is provisioned). The unsigned
      # binary is still attached to the release in that case.

      - name: Azure login (OIDC federated, no secret)
        if: vars.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Trusted Signing
        if: vars.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          # Endpoint is region-scoped. Set AZURE_TRUSTED_SIGNING_ENDPOINT
          # as a repo variable if your account isn't in East US.
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net' }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\host
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        if: vars.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        shell: pwsh
        working-directory: host
        run: |
          $sig = Get-AuthenticodeSignature -FilePath vaultsign-host.exe
          $sig | Format-List Path, Status, StatusMessage
          if ($sig.Status -ne "Valid") {
            Write-Error "Signature validation failed: $($sig.Status) — $($sig.StatusMessage)"
            exit 1
          }
          $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter, Thumbprint

      # ── Build the per-user Windows installer (Inno Setup) ────
      # Bundles the already-signed helper into a single Setup.exe that
      # a non-technical user can double-click. The outer Setup.exe is
      # signed in a second pass below so SmartScreen sees a Trusted
      # Signing signature on the wrapper too.

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Stage signed helper into installer directory
        shell: pwsh
        run: |
          Copy-Item host\vaultsign-host.exe installer\vaultsign-host.exe -Force
          $sig = Get-AuthenticodeSignature -FilePath installer\vaultsign-host.exe
          Write-Output "Staged helper signature status: $($sig.Status)"

      - name: Resolve installer AppVersion (strip leading v)
        id: installer_version
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.name }}'.TrimStart('v')
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Installer AppVersion: $version"

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          iscc /DAppVersion=${{ steps.installer_version.outputs.value }} installer\vaultsign-signer.iss
          Get-ChildItem installer\Output | Format-Table Name, Length

      - name: Sign installer with Trusted Signing
        if: vars.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net' }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installer\Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify installer signature
        if: vars.AZURE_TRUSTED_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\VaultSignSigner-Setup-*.exe |
                   Select-Object -First 1
          if (-not $setup) {
            Write-Error "Installer not found under installer\Output\"
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $setup.FullName
          $sig | Format-List Path, Status, StatusMessage
          if ($sig.Status -ne "Valid") {
            Write-Error "Installer signature validation failed: $($sig.Status) — $($sig.StatusMessage)"
            exit 1
          }
          $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter, Thumbprint

      # ── Stage + publish release artifacts ────────────────────
      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item host\vaultsign-host.exe                       release\
          Copy-Item host\build-provenance.json                    release\
          Copy-Item dist\vaultsign-signer-*.zip                   release\ -ErrorAction SilentlyContinue
          Copy-Item installer\Output\VaultSignSigner-Setup-*.exe  release\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE                                       release\
          Copy-Item README.md                                     release\
          Get-ChildItem release\ | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultsign-signer-${{ steps.tag.outputs.name }}
          path: release/
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release/vaultsign-host.exe
            release/build-provenance.json
            release/vaultsign-signer-*.zip
            release/VaultSignSigner-Setup-*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
